services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vertex_ops
      POSTGRES_USER: vertex
      POSTGRES_PASSWORD: vertex
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://vertex:vertex@postgres:5432/vertex_ops
      JWT_SECRET: change-me-in-production
    depends_on: [postgres]
    ports: ["4000:4000"]
volumes: { pgdata: {} }
